<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro e inicio de sesión</title>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>

  <!-- #24 Maquetar el formulario de registro -->
  <h2>Registro de usuario</h2>
  <form id="registro" onsubmit="return validarRegistro()">
    <label>Nombre</label>
    <input type="text" id="nombre">
    <span class="error" id="errorNombre"></span>

    <label>Email</label>
    <input type="text" id="email">
    <span class="error" id="errorEmail"></span>

    <label>Contraseña</label>
    <input type="password" id="password">
    <span class="error" id="errorPassword"></span>

    <button type="submit">Registrarse</button>
    <p id="mensajeRegistro"></p>
  </form>

  <hr>

  <!-- Inicio de sesión -->
  <h2>Inicio de sesión</h2>
  <form id="login" onsubmit="return validarLogin()">
    <label>Email</label>
    <input type="text" id="loginEmail">
    <span class="error" id="errorLoginEmail"></span>

    <label>Contraseña</label>
    <input type="password" id="loginPassword">

    <button type="submit">Entrar</button>
    <p class="error" id="errorLogin"></p>
    <p id="mensajeLogin"></p>
  </form>
  <p>Usuario de prueba: demo@correo.com / 1234</p>

</body>
</html>
