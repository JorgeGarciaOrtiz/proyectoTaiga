<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Tutorías</title>
    <link rel="stylesheet" href="tutorias.css" />
    <script src="tutorias.js" defer></script>
  </head>

  <body>
    <!-- Usuario con sesión iniciada -->
    <p>
      Sesión iniciada como <span id="nombreUsuario"></span>
      <button onclick="cerrarSesion()">Cerrar sesión</button>
    </p>

    <!-- Dos columnas: profesores a la izquierda y horarios a la derecha -->
    <div class="contenedor">
      <div class="columna-profesores">
        <!-- #29 Maquetar la lista de profesores -->
        <h2>Profesores</h2>

        <input
          type="text"
          id="buscador"
          placeholder="Buscar profesor..."
          onkeyup="buscarProfesor()"
        />

        <!-- #30 Las tarjetas se generan con JavaScript -->
        <div id="listaProfesores"></div>
      </div>

      <div class="columna-horarios">
        <!-- #31 Maquetar la tabla de horarios -->
        <h2>Horarios disponibles</h2>
        <p id="profesorElegido">Elige un profesor para ver sus horarios</p>

        <table id="tablaHorarios">
          <thead>
            <tr>
              <th>Día</th>
              <th>Hora</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="cuerpoHorarios"></tbody>
        </table>
        <p class="error" id="mensajeHorarios"></p>

        <!-- #34 Maquetar el formulario de reserva (oculto hasta pulsar "Reservar") -->
        <div id="formularioReserva" class="reserva oculto">
          <h3>Reservar tutoría</h3>
          <p><strong>Profesor:</strong> <span id="reservaProfesor"></span></p>
          <p><strong>Día:</strong> <span id="reservaDia"></span></p>
          <p><strong>Hora:</strong> <span id="reservaHora"></span></p>

          <label for="duda">¿Qué duda quieres resolver?</label>
          <textarea
            id="duda"
            rows="3"
            placeholder="Escribe aquí tu duda..."
          ></textarea>

          <!-- #35 Confirmar la reserva -->
          <button id="botonConfirmar" onclick="confirmarReserva()">Confirmar reserva</button>
          <button class="secundario" onclick="cerrarReserva()">Cancelar</button>
        </div>
      </div>
    </div>
  </body>
</html>
